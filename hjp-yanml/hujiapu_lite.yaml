# 必读！！！注意注释掉 分组github后不能访问的同类问题
# 此版本没有做防泄露处理，如介意请使用另一个名字为configdns的版本
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅
proxy-providers:
  # 包月16号刷新
  Airport1:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
  # 2000G
  Airport2:
    #url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
 
# 锚点
pr: &pr {type: select, proxies: [🚀 默认代理, ♻️ 全自动, 🔯 香港故转, 🔯 东亚故转, ♻️ 香港自动, ♻️ 台湾自动, ♻️ 美国自动, 🐬 香港低倍,🐬 东亚低倍, 🌐 全部节点, 直连]}
pr2: &pr2 {type: select, proxies: [🚀 默认代理, ♻️ 全自动, 🔯 香港故转, 🔯 东亚故转, 🐬 香港低倍,🐬 东亚低倍, 🌐 全部节点]}
# 策略组
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 全自动, 🔯 香港故转, 🔯 东亚故转, ♻️ 香港自动, ♻️ 台湾自动, ♻️ 美国自动, 🐬 香港低倍,🐬 东亚低倍,🐬 美国低倍, 🌐 冷门节点,🌐 全部节点, 直连]}
  - {name: 📹 YouTube, !!merge <<: *pr2}
  - {name: 🍀 Google, !!merge <<: *pr2}
  - {name: 🤖 AI, !!merge <<: *pr2}
  - {name: 👨🏿‍💻 GitHub, !!merge <<: *pr2}
  #- {name: 🐬 OneDrive, !!merge <<: *pr2}
  - {name: 🪟 Microsoft, type: select, proxies: [♻️ 全自动, 直连]}
  #- {name: 🎵 TikTok, !!merge <<: *pr2}
  #- {name: 📲 Telegram, !!merge <<: *pr2}
  - {name: 🎥 NETFLIX, !!merge <<: *pr2}
  #- {name: 💶 PayPal, !!merge <<: *pr2}
  - {name: 🐟 漏网之鱼, !!merge <<: *pr2}
  #- {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?=.*(港))"}
  #- {name: 🇨🇳 台湾节点, type: select, include-all: true, filter: "(?=.*(台))"}
  #- {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?=.*(日本|JP))"}
  #- {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?=.*(新))"}
  #- {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?=.*(美国))"}
  - {name: 🔯 香港故转, type: fallback, include-all: true, interval: 300, filter: "(?=.*(港))"}
  - {name: 🔯 东亚故转, type: fallback, include-all: true, interval: 300, filter: "(?=.*(台|韩|美国|日本|新加))"}
  #- {name: 🔯 台湾故转, type: fallback, include-all: true, interval: 300, filter: "(?=.*(台))"}
  #- {name: 🔯 日本故转, type: fallback, include-all: true, interval: 300, filter: "(?=.*(日本|JP))"}
  #- {name: 🔯 狮城故转, type: fallback, include-all: true, interval: 300, filter: "(?=.*(新))"}
  #- {name: 🔯 美国故转, type: fallback, include-all: true, interval: 300, filter: "(?=.*(美国))"}

  - {name: ♻️ 香港自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港))"}
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(台))"}
  #- {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日本|JP))"}
  #- {name: ♻️ 狮城自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(新))"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美国))"}

  - {name: 🐬 香港低倍, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(0|.5))^((?!(美国|台|日本|新)).)*$"}
  - {name: 🐬 东亚低倍, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(0|.5))^((?!(港|美国)).)*$"}
  #- {name: 🐬 台湾低倍, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(0|.5))^((?!(港|美国|日本|新)).)*$"}
  #- {name: 🐬 日本低倍, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(0|.5))^((?!(港|美国|台|新)).)*$"}
  #- {name: 🐬 狮城低倍, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(0|.5))^((?!(港|美国|台|日本)).)*$"}
  - {name: 🐬 美国低倍, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(0|.5))^((?!(港|台|日本|新)).)*$"}
  - {name: ♻️ 全自动, type: url-test, include-all: true}
  - {name: 🌐 冷门节点, type: select, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(港|台|日本|新|美国|直|剩|套|官|邮|异)).)*$"}
  - {name: 🌐 全部节点, type: select, include-all: true}

# 规则匹配
rules:

  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  - DOMAIN-SUFFIX,qichiyu.com,🚀 默认代理
  - RULE-SET,proxylite,🚀 默认代理
  - RULE-SET,ai,🤖 AI
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  #- RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  #- RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,apple_domain,直连
  #- RULE-SET,tiktok_domain,🎵 TikTok
  #- RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 NETFLIX
  #- RULE-SET,paypal_domain,💶 PayPal
  - RULE-SET,apple_ip,直连
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,netflix_ip,🎥 NETFLIX
  #- RULE-SET,telegram_ip,📲 Telegram
  - RULE-SET,geolocation-!cn,🚀 默认代理
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连
  - MATCH,🐟 漏网之鱼

# 规则集
